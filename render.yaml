services:
  - type: web
    name: ai-real-estate-advisor-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python src/train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
